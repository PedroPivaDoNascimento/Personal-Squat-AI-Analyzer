<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Agachamento - Início</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 900px;
            width: 100%;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.2em;
        }
        
        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .divider {
            border: none;
            border-top: 2px solid #eee;
            margin: 20px 0 30px 0;
        }
        
        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .option-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 25px 20px;
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            border: none;
            width: 100%;
            font-size: 1em;
            color: #333;
            font-weight: 600;
        }
        
        .option-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .option-card a {
            text-decoration: none;
            color: inherit;
            display: block;
        }
        
        .icon {
            font-size: 2.5em;
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏋️ Programa de Análise de Agachamento</h1>
        <p class="subtitle">Por favor, selecione o tipo de agachamento que você deseja analisar:</p>
        
        <hr class="divider">
        
        <div class="options-grid">
            <button class="option-card" onclick="location.href='{% url 'sagittal_right' %}'">
                <span class="icon">📊</span>
                Agachamento Sagital Direito (SLS)
            </button>
            
            <button class="option-card" onclick="location.href='{% url 'frontal_right' %}'">
                <span class="icon">📈</span>
                Agachamento Frontal Direito (SLS)
            </button>
            
            <button class="option-card" onclick="location.href='{% url 'sagittal_left' %}'">
                <span class="icon">📊</span>
                Agachamento Sagital Esquerdo (SLS)
            </button>
            
            <button class="option-card" onclick="location.href='{% url 'frontal_left' %}'">
                <span class="icon">📈</span>
                Agachamento Frontal Esquerdo (SLS)
            </button>
        </div>
    </div>
</body>
</html>
