<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Análise de Agachamento{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Paleta de Cores de Alta Performance (Slate & Indigo Profundo) */
            --bg-main: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: rgba(79, 70, 229, 0.1);
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;

            /* Semântica Refinada e Dessaturada (Acessibilidade WCAG) */
            --success: #10b981;
            --success-bg: #ecfdf5;
            --success-border: #a7f3d0;
            --success-text: #065f46;
            
            --danger: #ef4444;
            --danger-bg: #fef2f2;
            --danger-border: #fca5a5;
            --danger-text: #991b1b;
            
            --warning: #f59e0b;
            --warning-bg: #fffbeb;
            --warning-border: #fef3c7;
            --warning-text: #92400e;
            
            --info: #06b6d4;
            --info-bg: #ecfeff;
            --info-border: #bae6fd;
            --info-text: #0369a1;

            /* Raio de Bordas e Espaçamentos uniformes */
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 16px;
            
            /* Sombras Arquiteturais em Camadas */
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Reset e Configurações de Base */
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-main); 
            color: var(--text-main); 
            line-height: 1.6;
            padding: 40px 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container { 
            max-width: 1140px; 
            margin: 0 auto; 
            background: var(--bg-card); 
            padding: 40px; 
            border-radius: var(--radius-lg); 
            box-shadow: var(--shadow-md); 
            border: 1px solid var(--border-color);
        }

        /* Hierarquia Tipográfica Avançada */
        h1 { font-size: 26px; font-weight: 700; color: var(--text-main); letter-spacing: -0.02em; margin-bottom: 24px; display: flex; align-items: center; gap: 10px; }
        h2 { font-size: 18px; font-weight: 600; color: var(--text-main); margin: 32px 0 16px; letter-spacing: -0.01em; }
        h3 { font-size: 15px; font-weight: 600; color: var(--text-main); margin-bottom: 12px; }
        p { color: var(--text-muted); font-size: 15px; }

        /* Botões Baseados em Microinterações */
        .btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            padding: 10px 22px; 
            background: var(--primary); 
            color: #ffffff; 
            text-decoration: none; 
            border-radius: var(--radius-sm); 
            margin: 4px; 
            border: 1px solid transparent; 
            cursor: pointer; 
            font-size: 14px; 
            font-weight: 500; 
            box-shadow: var(--shadow-sm);
            transition: var(--transition); 
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-1px); box-shadow: var(--shadow-md); }
        .btn:active { transform: translateY(0); }
        .btn-secondary { background: #f1f5f9; color: var(--text-muted); border: 1px solid var(--border-color); box-shadow: none; }
        .btn-secondary:hover { background: #e2e8f0; color: var(--text-main); border-color: var(--border-hover); }
        .btn-success { background: var(--success); }
        .btn-success:hover { background: #059669; }

        /* Componentização de Formulários */
        form { margin: 24px 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: var(--text-main); }
        
        input[type="text"], input[type="number"], input[type="file"] { 
            width: 100%; 
            padding: 12px 14px; 
            border: 1px solid var(--border-color); 
            border-radius: var(--radius-sm); 
            font-size: 14px; 
            font-family: inherit;
            color: var(--text-main);
            background-color: #ffffff;
            transition: var(--transition);
        }
        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        input[type="file"] {
            background: #f8fafc;
            cursor: pointer;
            padding: 10px;
        }
        
        /* Containers de Sliders (Range Modernizados) */
        .range-container {
            background: #f8fafc;
            padding: 16px;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
            transition: var(--transition);
        }
        .range-container:hover {
            border-color: var(--border-hover);
        }
        .range-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .range-header label { margin-bottom: 0; }
        .range-value {
            font-weight: 600;
            font-size: 13px;
            color: var(--primary);
            background: var(--primary-light);
            padding: 2px 10px;
            border-radius: 20px;
            min-width: 45px;
            text-align: center;
        }
        input[type="range"] { 
            -webkit-appearance: none;
            appearance: none;
            width: 100%; 
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            outline: none;
            margin: 8px 0;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
            border: 2px solid #ffffff;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
            background: var(--primary-hover);
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border: 2px solid #ffffff;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.15);
        }

        /* Grid Multicolunas */
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; margin: 20px 0; }
        .form-col { display: flex; flex-direction: column; }
        
        /* Checkbox Refinado */
        .checkbox-group { display: flex; flex-wrap: wrap; gap: 16px; margin: 12px 0 24px; padding: 14px 18px; background: #f8fafc; border-radius: var(--radius-sm); border: 1px solid var(--border-color); }
        .checkbox-group label { display: inline-flex; align-items: center; gap: 8px; margin: 0; font-weight: 400; cursor: pointer; font-size: 14px; }
        .checkbox-group input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); cursor: pointer; }

        /* Tabelas de Relatórios de Alta Fidelidade */
        .table-responsive { width: 100%; overflow-x: auto; margin: 18px 0; border-radius: var(--radius-md); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
        table { width: 100%; border-collapse: collapse; text-align: left; background: #ffffff; }
        th, td { padding: 14px 18px; font-size: 14px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { background: #f8fafc; font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 11px; letter-spacing: 0.05em; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #fafbfc; }

        /* Cards do Dashboard */
        .card { 
            background: var(--bg-card);
            border: 1px solid var(--border-color); 
            padding: 24px; 
            margin: 20px 0; 
            border-radius: var(--radius-md); 
            box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .card:hover { box-shadow: var(--shadow-md); border-color: var(--border-hover); }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 24px; margin-top: 24px; }

        /* Mensagens de Feedback & Alerts */
        .alert { padding: 16px 20px; margin: 20px 0; border-radius: var(--radius-md); font-size: 15px; font-weight: 500; display: flex; flex-direction: column; gap: 6px; }
        .alert h2 { margin: 0; font-size: 16px; }
        .alert-info { background: var(--info-bg); color: var(--info-text); border: 1px solid var(--info-border); }
        .alert-success { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
        
        /*flash messages*/
        .messages { list-style: none; margin: 20px 0; padding: 0; }
        .messages li { padding: 16px 20px; margin-bottom: 12px; border-radius: var(--radius-md); font-size: 15px; font-weight: 500; }
        .messages .error { background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border); }
        .messages .success { background: var(--success-bg); color: var(--success-text); border: 1px solid var(--success-border); }
        .messages .warning { background: var(--warning-bg); color: var(--warning-text); border: 1px solid var(--warning-border); }
        .messages .info { background: var(--info-bg); color: var(--info-text); border: 1px solid var(--info-border); }


        /* Caixa de feedback por repetição */
        .feedback { 
            background: var(--warning-bg); 
            padding: 16px; 
            margin-top: 16px; 
            border-radius: var(--radius-sm); 
            border: 1px solid var(--warning-border); 
            color: var(--warning-text);
        }
        .feedback strong { font-size: 14px; font-weight: 600; }
        .feedback ul { margin-left: 20px; margin-top: 6px; font-size: 14px; }
        .feedback li { margin-bottom: 4px; }

        /* Badges Semânticos de Status */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            font-size: 12px;
            font-weight: 600;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }
        .status-badge.ok { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
        .status-badge.error { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }

        .help-text { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        {# Mensagens flash do Django #}
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
            <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
