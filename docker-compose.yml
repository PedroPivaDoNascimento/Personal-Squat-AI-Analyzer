services:
  web:
    build: .
    command: python manage.py runserver ifgnutest.riopomba.ifsudestemg.edu.br:9000
    env_file:
      - .env
    volumes:
      # Monta o código fonte para desenvolvimento dentro do container
      - .:/app
      # Volume persistente para o SQLite
      - sqlite_data:/app
      # Volume para arquivos de mídia (uploads)
      - media_volume:/app/media
    ports:
      - "9000:9000"
volumes:
  sqlite_data:
  media_volume: